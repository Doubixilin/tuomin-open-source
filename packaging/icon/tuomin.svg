<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tuomin app icon: a document whose sensitive line became a placeholder pill. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7bff"/>
      <stop offset="1" stop-color="#6e4fff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b1740" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS-style rounded square (squircle approximation) -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>
  <!-- document card with folded corner -->
  <g filter="url(#shadow)">
    <path d="M318 224 H612 L706 318 V760 a46 46 0 0 1 -46 46 H364 a46 46 0 0 1 -46 -46 V270 a46 46 0 0 1 46 -46 Z" fill="#ffffff"/>
    <path d="M612 224 V272 a46 46 0 0 0 46 46 H706 Z" fill="#dfe6ff"/>
  </g>
  <!-- text lines -->
  <rect x="378" y="372" width="196" height="38" rx="19" fill="#cdd6ea"/>
  <rect x="378" y="596" width="268" height="38" rx="19" fill="#cdd6ea"/>
  <rect x="378" y="672" width="160" height="38" rx="19" fill="#cdd6ea"/>
  <!-- the redacted line: a placeholder pill with chevrons -->
  <rect x="378" y="464" width="268" height="78" rx="39" fill="url(#pill)"/>
  <path d="M438 482 l-28 21 28 21" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M586 482 l28 21 -28 21" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="470" y="493" width="84" height="20" rx="10" fill="#ffffff" fill-opacity="0.85"/>
</svg>
