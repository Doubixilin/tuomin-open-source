name: 源码回归
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', extras: dev}
          - {os: ubuntu-latest, python: '3.12', extras: dev}
          - {os: macos-latest, python: '3.12', extras: 'dev,shell,pdf,pdf-text'}
          - {os: windows-latest, python: '3.12', extras: 'dev,shell,pdf,pdf-text'}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HOME: '.cache/ci-empty-models'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - run: python -m pip install .
      - name: 验证普通安装的资源和可选依赖
        run: >-
          python -c "import importlib.util as u; from importlib.resources import files;
          assert all(u.find_spec(n) is None for n in ('torch', 'transformers', 'pymupdf'));
          root=files('tuomin_gateway');
          assert all(root.joinpath('service/static', n).is_file() for n in ('index.html','shell-ui.js','tuomin-theme.css','tuomin-logo.svg'));
          assert root.joinpath('document/vendor/NOTICE.md').is_file()"
      - run: python examples/minimal_demo.py
      - run: python -m pip install ".[${{ matrix.extras }}]"
      - run: python -m pytest -q
      - run: npm test
        env:
          PYTHON: python
