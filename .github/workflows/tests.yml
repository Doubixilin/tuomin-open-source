name: 无模型示例与回归测试
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HOME: '.cache/ci-empty-models'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install .
      - name: 验证基础安装不含模型与 PDF 依赖
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ('torch', 'transformers', 'pymupdf')); from importlib.resources import files; assert (files('tuomin_gateway') / 'service/static/index.html').is_file()"
      - run: python examples/minimal_demo.py
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
