[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tuomin-gateway"
version = "0.1.0"
description = "脱敏网关：本地脱敏网关与桌面工作台，支持规则与词典、文档处理、占位符映射及严格回填"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["cryptography>=46,<47", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
# Native backends are selected per OS; Windows never installs PyObjC.
shell = [
    "pywebview==5.4",
    "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-UserNotifications==12.2.2; sys_platform == 'darwin'",
    "pythonnet==3.0.5; sys_platform == 'win32'",
    "pystray==0.19.5; sys_platform == 'win32'",
    "Pillow>=11,<13; sys_platform == 'win32'",
]
serve = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27,<1"]
document = ["openpyxl>=3.1,<4", "xlrd>=2.0,<3"]
# PyMuPDF has its own AGPL/commercial terms; see THIRD_PARTY_NOTICES.md.
pdf = ["pymupdf>=1.24,<2"]
ner = ["transformers>=4.40,<6", "torch>=2.0,<3"]
dev = ["python-docx>=1.1,<2", "pytest>=8,<10", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27,<1", "openpyxl>=3.1,<4", "xlrd>=2.0,<3"]

[project.scripts]
tuomin-gateway = "tuomin_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tuomin_gateway = ["service/static/*.html", "service/static/*.css", "service/static/*.js", "service/static/*.svg", "document/vendor/NOTICE.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
